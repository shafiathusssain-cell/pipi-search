<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f46308" />
    <meta
      name="description"
      content="Pokdex Search — the private search engine that doesn't track you. Search the web privately with no tracking, no saved history, and no ad profile. Results powered by DuckDuckGo."
    />
    <meta name="keywords" content="private search engine, Pokdex Search, private search, no tracking, duckduckgo powered" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Pokdex Search — search privately, stay under the radar" />
    <meta
      property="og:description"
      content="The private search engine that doesn't track you. No tracking, no saved history, no ad profile. Results powered by DuckDuckGo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pokdex Search" />
    <meta property="og:url" content="https://www.pokdex.co.uk/" />
    <meta property="og:image" content="https://www.pokdex.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pokdex Search — private search engine home page" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pokdex Search — search privately, stay under the radar" />
    <meta
      name="twitter:description"
      content="The private search engine that doesn't track you. No tracking, no saved history, no ad profile."
    />
    <meta name="twitter:image" content="https://www.pokdex.co.uk/og-image.png" />
    <meta name="twitter:site" content="@pokdexsearch" />
    <title>Pokdex Search — the search engine that doesn't track you</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pokdex Search",
        "url": "https://www.pokdex.co.uk/",
        "description": "A private search engine that doesn't track you, powered by DuckDuckGo.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.pokdex.co.uk/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
